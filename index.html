<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>승우와의 대화 게임</title>

    <style>

        /* =========================================================
           BASIC
        ========================================================= */

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            font-family:
                "Pretendard",
                "Noto Sans KR",
                "Apple SD Gothic Neo",
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at 15% 10%,
                    rgba(99,102,241,.28),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 90% 90%,
                    rgba(14,165,233,.22),
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #070b18,
                    #111936 52%,
                    #070b16
                );

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100dvh;

            overflow: hidden;

            color: #161a2d;
        }


        /* =========================================================
           BACKGROUND LIGHT
        ========================================================= */

        body::before,
        body::after {
            content: "";

            position: fixed;

            width: 420px;
            height: 420px;

            border-radius: 50%;

            filter: blur(100px);

            opacity: .22;

            pointer-events: none;

            animation:
                floatingOrb
                10s
                ease-in-out
                infinite
                alternate;
        }

        body::before {
            background: #6366f1;

            top: -220px;
            left: -180px;
        }

        body::after {
            background: #06b6d4;

            right: -190px;
            bottom: -220px;

            animation-delay: -5s;
        }

        @keyframes floatingOrb {

            from {
                transform:
                    translate3d(0,0,0)
                    scale(1);
            }

            to {
                transform:
                    translate3d(45px,35px,0)
                    scale(1.15);
            }

        }


        /* =========================================================
           GAME CONTAINER
        ========================================================= */

        #game-container {

            width:
                min(
                    430px,
                    calc(100vw - 28px)
                );

            height:
                min(
                    680px,
                    calc(100dvh - 28px)
                );

            min-height: 520px;

            background:
                linear-gradient(
                    160deg,
                    rgba(255,255,255,.98),
                    rgba(246,248,255,.96)
                );

            border:
                1px solid
                rgba(255,255,255,.9);

            border-radius: 32px;

            box-shadow:
                0 40px 100px rgba(0,0,0,.38),
                0 15px 40px rgba(0,0,0,.18),
                inset 0 1px 0 rgba(255,255,255,1);

            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);

            display: flex;

            flex-direction: column;

            align-items: center;

            padding: 24px;

            position: relative;

            overflow: hidden;

            isolation: isolate;
        }


        /* 위쪽 빛 */

        #game-container::before {

            content: "";

            position: absolute;

            width: 300px;
            height: 180px;

            top: -130px;
            left: 50%;

            transform:
                translateX(-50%);

            background:
                radial-gradient(
                    circle,
                    rgba(99,102,241,.28),
                    transparent 70%
                );

            filter: blur(25px);

            pointer-events: none;
        }


        /* =========================================================
           SCREEN
        ========================================================= */

        .screen {

            display: none;

            flex-direction: column;

            align-items: center;

            width: 100%;
            height: 100%;

            justify-content: space-between;

            position: relative;

            z-index: 2;

            opacity: 0;
        }

        .screen.active {

            display: flex;

            animation:
                screenEnter
                .45s
                cubic-bezier(.22,1,.36,1)
                forwards;
        }

        .screen.screen-exit {

            animation:
                screenExit
                .25s
                ease
                forwards;
        }

        @keyframes screenEnter {

            0% {

                opacity: 0;

                transform:
                    translateY(18px)
                    scale(.975);

                filter: blur(4px);
            }

            100% {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);

                filter: blur(0);
            }

        }

        @keyframes screenExit {

            from {

                opacity: 1;

                transform:
                    translateY(0);
            }

            to {

                opacity: 0;

                transform:
                    translateY(-12px);
            }

        }


        /* =========================================================
           TITLE
        ========================================================= */

        h2 {

            margin:
                12px 0 0;

            font-size: 34px;

            font-weight: 950;

            letter-spacing: -2px;

            background:
                linear-gradient(
                    135deg,
                    #4052ff,
                    #7647ff 55%,
                    #009eea
                );

            -webkit-background-clip: text;

            background-clip: text;

            color: transparent;

            animation:
                titleFloat
                3s
                ease-in-out
                infinite;
        }

        h3 {

            margin:
                10px 0;

            font-size: 22px;

            font-weight: 900;

            letter-spacing: -1px;
        }

        @keyframes titleFloat {

            0%,100% {
                transform:
                    translateY(0);
            }

            50% {
                transform:
                    translateY(-4px);
            }

        }


        /* =========================================================
           CHARACTER IMAGE
        ========================================================= */

        img.character-img {

            width: auto;

            max-width: 250px;

            max-height: 250px;

            object-fit: contain;

            border-radius: 22px;

            margin-bottom: 14px;

            filter:
                drop-shadow(
                    0 18px 25px
                    rgba(20,30,80,.18)
                );

            transition:
                transform .3s ease,
                filter .3s ease;

            animation:
                characterAppear
                .6s
                cubic-bezier(.22,1,.36,1);
        }

        img.character-img:hover {

            transform:
                translateY(-6px)
                scale(1.025);

            filter:
                drop-shadow(
                    0 22px 30px
                    rgba(50,65,180,.24)
                );
        }

        @keyframes characterAppear {

            from {

                opacity: 0;

                transform:
                    translateY(22px)
                    scale(.9);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }

        }


        /* =========================================================
           SPEECH BUBBLE
        ========================================================= */

        .speech-bubble {

            background:
                linear-gradient(
                    145deg,
                    #f0f7ff,
                    #eef1ff
                );

            border:
                1px solid
                rgba(90,110,220,.12);

            border-radius: 20px;

            padding:
                16px
                18px;

            position: relative;

            width: 92%;

            text-align: center;

            font-size: 16px;

            font-weight: 750;

            line-height: 1.55;

            box-shadow:
                0 10px 25px
                rgba(40,60,150,.07),

                inset 0 1px 0
                rgba(255,255,255,.9);

            margin-bottom: 10px;

            word-break: keep-all;

            animation:
                bubbleAppear
                .45s
                cubic-bezier(.22,1,.36,1);
        }

        .speech-bubble::after {

            content: "";

            position: absolute;

            bottom: -7px;

            left: 50%;

            width: 14px;

            height: 14px;

            background: #eef4ff;

            transform:
                translateX(-50%)
                rotate(45deg);

            border-right:
                1px solid
                rgba(90,110,220,.08);

            border-bottom:
                1px solid
                rgba(90,110,220,.08);
        }

        @keyframes bubbleAppear {

            from {

                opacity: 0;

                transform:
                    translateY(8px)
                    scale(.97);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }

        }


        /* =========================================================
           INPUT
        ========================================================= */

        .input-box {

            width: 88%;

            padding:
                15px
                17px;

            margin:
                10px 0;

            font-size: 16px;

            font-weight: 700;

            border:
                2px solid
                #e2e5f0;

            border-radius: 15px;

            outline: none;

            text-align: center;

            background: #fff;

            color: #171a2c;

            box-shadow:
                0 5px 16px
                rgba(20,30,70,.05);

            transition:
                border-color .2s ease,
                box-shadow .2s ease,
                transform .2s ease;
        }

        .input-box::placeholder {

            color: #a3a8b9;
        }

        .input-box:focus {

            border-color: #6675ff;

            box-shadow:
                0 0 0 4px
                rgba(102,117,255,.12),

                0 8px 20px
                rgba(60,70,170,.08);

            transform:
                translateY(-1px);
        }

        .input-box:disabled {

            background: #f2f4fa;

            color: #7d8294;

            cursor: not-allowed;
        }


        /* =========================================================
           BUTTON
        ========================================================= */

        .btn {

            position: relative;

            overflow: hidden;

            background:
                linear-gradient(
                    135deg,
                    #5063ff,
                    #7448ff
                );

            color: white;

            padding:
                13px
                20px;

            border: none;

            border-radius: 15px;

            cursor: pointer;

            font-size: 15px;

            font-weight: 850;

            letter-spacing: -.3px;

            margin: 5px;

            width: 92%;

            min-height: 48px;

            box-shadow:
                0 8px 20px
                rgba(80,95,255,.25),

                inset 0 1px 0
                rgba(255,255,255,.25);

            transition:
                transform .15s ease,
                box-shadow .15s ease,
                filter .15s ease;
        }

        .btn::before {

            content: "";

            position: absolute;

            top: 0;

            left: -110%;

            width: 60%;

            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,.35),
                    transparent
                );

            transform:
                skewX(-20deg);

            transition:
                left .55s ease;
        }

        .btn:hover::before {

            left: 130%;
        }

        .btn:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 13px 28px
                rgba(80,95,255,.32),

                inset 0 1px 0
                rgba(255,255,255,.3);

            filter:
                brightness(1.04);
        }

        .btn:active {

            transform:
                translateY(1px)
                scale(.98);
        }


        /* =========================================================
           OPTIONS
        ========================================================= */

        .options-container {

            width: 100%;

            display: flex;

            flex-direction: column;

            align-items: center;

            margin-top: 6px;
        }

        .options-container .btn {

            animation:
                optionAppear
                .4s
                cubic-bezier(.22,1,.36,1)
                both;
        }

        .options-container .btn:nth-child(1) {

            animation-delay: .04s;
        }

        .options-container .btn:nth-child(2) {

            animation-delay: .1s;
        }

        .options-container .btn:nth-child(3) {

            animation-delay: .16s;
        }

        .options-container .btn:nth-child(4) {

            animation-delay: .22s;
        }

        @keyframes optionAppear {

            from {

                opacity: 0;

                transform:
                    translateY(12px)
                    scale(.97);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }

        }


        /* =========================================================
           START SCREEN
        ========================================================= */

        #screen-start {

            justify-content:
                space-around;
        }

        #screen-start > div {

            transition:
                transform
                .3s
                cubic-bezier(.22,1,.36,1);
        }

        #screen-start > div:hover {

            transform:
                scale(1.025);
        }

        #screen-start img {

            cursor: pointer;

            animation:
                characterAppear
                .7s
                cubic-bezier(.22,1,.36,1),

                startImageFloat
                3.2s
                ease-in-out
                .7s
                infinite;
        }

        @keyframes startImageFloat {

            0%,100% {

                transform:
                    translateY(0);
            }

            50% {

                transform:
                    translateY(-9px);
            }

        }


        /* =========================================================
           QUIZ SCREEN
        ========================================================= */

        #screen-quiz {

            justify-content:
                flex-start;

            gap: 6px;

            overflow-y: auto;

            overflow-x: hidden;

            padding:
                4px
                2px
                8px;

            scrollbar-width: none;
        }

        #screen-quiz::-webkit-scrollbar {

            display: none;
        }


        /* =========================================================
           QUIZ TITLE
        ========================================================= */

        #quiz-title {

            width: 100%;

            margin:
                0
                0
                4px;

            padding:
                10px
                14px;

            border-radius: 14px;

            background:
                linear-gradient(
                    135deg,
                    #f1f3ff,
                    #f6f0ff
                );

            color: #5964dc;

            font-size: 15px;

            font-weight: 900;

            letter-spacing: -.4px;

            text-align: center;

            box-shadow:
                inset 0 1px 0
                rgba(255,255,255,.9);
        }


        /* =========================================================
           QUIZ PROGRESS
        ========================================================= */

        #quiz-progress {

            width: 94%;

            margin:
                2px
                0
                8px;
        }

        #progress-text {

            display: block;

            margin-bottom: 6px;

            font-size: 11px;

            font-weight: 900;

            letter-spacing: 1px;

            color: #7b8198;

            text-align: right;
        }

        .progress-bar {

            width: 100%;

            height: 7px;

            background: #e8eaf3;

            border-radius: 999px;

            overflow: hidden;
        }

        #progress-fill {

            width: 25%;

            height: 100%;

            border-radius: 999px;

            background:
                linear-gradient(
                    90deg,
                    #5265ff,
                    #824cff
                );

            transition:
                width .45s
                cubic-bezier(.22,1,.36,1);
        }


        /* =========================================================
           QUIZ IMAGE
        ========================================================= */

        #quiz-img {

            max-height: 200px;

            margin:
                2px
                0
                6px;
        }


        /* =========================================================
           QUIZ QUESTION
        ========================================================= */

        #quiz-question {

            width: 94%;

            margin-bottom: 7px;

            font-size: 17px;

            font-weight: 850;
        }


        /* =========================================================
           FEEDBACK
        ========================================================= */

        #quiz-feedback {

            animation:
                feedbackAppear
                .4s
                cubic-bezier(.22,1,.36,1);

            width: 94%;

            font-size: 15px;

            font-weight: 800;
        }

        @keyframes feedbackAppear {

            0% {

                opacity: 0;

                transform:
                    scale(.9)
                    translateY(8px);
            }

            70% {

                transform:
                    scale(1.02);
            }

            100% {

                opacity: 1;

                transform:
                    scale(1)
                    translateY(0);
            }

        }


        /* =========================================================
           SHAKE
        ========================================================= */

        .shake {

            animation:
                shake
                .42s
                ease;
        }

        @keyframes shake {

            0%,100% {

                transform:
                    translateX(0);
            }

            20% {

                transform:
                    translateX(-8px);
            }

            40% {

                transform:
                    translateX(8px);
            }

            60% {

                transform:
                    translateX(-5px);
            }

            80% {

                transform:
                    translateX(5px);
            }

        }


        /* =========================================================
           RIPPLE
        ========================================================= */

        .ripple {

            position: absolute;

            border-radius: 50%;

            transform:
                scale(0);

            background:
                rgba(255,255,255,.45);

            animation:
                ripple
                .55s
                linear;

            pointer-events: none;
        }

        @keyframes ripple {

            to {

                transform:
                    scale(4);

                opacity: 0;
            }

        }


        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 480px) {

            body {

                padding: 10px;
            }

            #game-container {

                width: 100%;

                height:
                    calc(100dvh - 20px);

                min-height: 0;

                border-radius: 26px;

                padding:
                    18px
                    13px
                    13px;
            }

            h2 {

                font-size: 29px;
            }

            h3 {

                font-size: 20px;
            }

            img.character-img {

                max-width:
                    min(220px,68vw);

                max-height: 200px;
            }

            #quiz-img {

                max-height: 170px;
            }

            .speech-bubble {

                width: 95%;

                font-size: 15px;

                padding:
                    13px
                    14px;
            }

            .btn {

                width: 95%;

                min-height: 48px;

                font-size: 15px;

                padding:
                    12px
                    14px;
            }

            .input-box {

                width: 90%;

                font-size: 16px;
            }

        }


        /* =========================================================
           SMALL PHONE
        ========================================================= */

        @media (max-height: 650px) {

            #game-container {

                padding-top: 12px;
            }

            h2 {

                margin:
                    3px 0;
            }

            img.character-img {

                max-height: 155px;
            }

            #quiz-img {

                max-height: 125px;
            }

            .speech-bubble {

                padding:
                    10px
                    12px;
            }

            .btn {

                min-height: 43px;

                padding:
                    9px
                    14px;
            }

        }


        /* =========================================================
           TOUCH
        ========================================================= */

        @media (hover: none) {

            .btn:hover {

                transform: none;

                filter: none;

                box-shadow:
                    0 8px 20px
                    rgba(80,95,255,.25),

                    inset 0 1px 0
                    rgba(255,255,255,.25);
            }

            img.character-img:hover {

                transform: none;
            }

            .btn:active {

                transform:
                    scale(.96);
            }

        }


        /* =========================================================
           REDUCED MOTION
        ========================================================= */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {

                animation-duration:
                    .01ms !important;

                animation-iteration-count:
                    1 !important;

                transition-duration:
                    .01ms !important;
            }

        }

    </style>
</head>


<body>


<div id="game-container">


    <!-- =========================================================
         START
    ========================================================= -->

    <div
        id="screen-start"
        class="screen active"
    >

        <h2>
            승우 게임
        </h2>


        <div
            style="
                position:relative;
                cursor:pointer;
            "
            onclick="goToNameInput()"
        >

            <div class="speech-bubble">
                나를 눌러봐!
            </div>


            <img
                src="photo1.png"
                alt="첫번째 사진"
                class="character-img"
            >

        </div>

    </div>



    <!-- =========================================================
         NAME INPUT
    ========================================================= -->

    <div
        id="screen-name"
        class="screen"
    >

        <h3>
            이름을 입력하시오
        </h3>


        <input
            type="text"
            id="user-name-input"
            class="input-box"
            placeholder="이름 입력..."
            autocomplete="off"
        >


        <button
            class="btn"
            onclick="saveName()"
        >
            확인
        </button>

    </div>



    <!-- =========================================================
         DIALOG
    ========================================================= -->

    <div
        id="screen-dialog"
        class="screen"
    >

        <img
            src="photo1.png"
            alt="첫번째 사진"
            class="character-img"
        >


        <div
            id="dialog-text"
            class="speech-bubble"
        >
            하이, 내 이름은 이승우야. 만나서 반가워
        </div>


        <div
            id="dialog-options"
            class="options-container"
        >
        </div>

    </div>



    <!-- =========================================================
         QUIZ
    ========================================================= -->

    <div
        id="screen-quiz"
        class="screen"
    >

        <h3 id="quiz-title">
            문제
        </h3>


        <!-- 진행률 -->

        <div id="quiz-progress">

            <span id="progress-text">
                STAGE 1 / 4
            </span>


            <div class="progress-bar">

                <div
                    id="progress-fill"
                ></div>

            </div>

        </div>


        <img
            id="quiz-img"
            src=""
            alt="퀴즈 이미지"
            class="character-img"
        >


        <div
            id="quiz-question"
            class="speech-bubble"
        >
            질문
        </div>


        <input
            type="text"
            id="quiz-answer-input"
            class="input-box"
            placeholder="정답 입력..."
            autocomplete="off"
        >


        <button
            class="btn"
            onclick="submitAnswer()"
        >
            정답 제출
        </button>


        <div
            id="quiz-feedback"
            class="speech-bubble"
            style="
                display:none;
                margin-top:10px;
            "
        ></div>


        <button
            id="next-stage-btn"
            class="btn"
            style="display:none;"
            onclick="nextQuizStage()"
        >
            다음으로
        </button>

    </div>


</div>



<script>


    /* =========================================================
       VARIABLES
    ========================================================= */

    let userName = "";

    let currentQuizStage = 1;



    /* =========================================================
       IMAGE
    ========================================================= */

    const images = {

        photo1: "photo1.png",

        photo2: "photo2.png",

        photo3: "photo3.png",

        photo4: "photo4.png"

    };



    /* =========================================================
       SCREEN TRANSITION
    ========================================================= */

    function showScreen(screenId) {

        const currentScreen =
            document.querySelector(
                ".screen.active"
            );


        const nextScreen =
            document.getElementById(
                screenId
            );


        if (
            currentScreen === nextScreen
        ) {

            return;

        }


        if (currentScreen) {

            currentScreen.classList.add(
                "screen-exit"
            );


            setTimeout(() => {

                currentScreen.classList.remove(
                    "active"
                );


                currentScreen.classList.remove(
                    "screen-exit"
                );


                nextScreen.classList.add(
                    "active"
                );

            }, 260);

        }

        else {

            nextScreen.classList.add(
                "active"
            );

        }

    }



    /* =========================================================
       START
    ========================================================= */

    function goToNameInput() {

        showScreen(
            "screen-name"
        );


        setTimeout(() => {

            document
                .getElementById(
                    "user-name-input"
                )
                .focus();

        }, 350);

    }



    /* =========================================================
       SAVE NAME
    ========================================================= */

    function saveName() {

        const input =
            document
                .getElementById(
                    "user-name-input"
                )
                .value
                .trim();


        if (
            input === ""
        ) {

            alert(
                "이름을 입력해 주세요!"
            );


            const inputBox =

        userName = input;

            "screen-dialog"
        );

    /* =========================================================
       INITIAL DIALOG
    ========================================================= */

    function setupInitialDialog() {

        const optionsContainer =
            document.getElementById(
                "dialog-options"
            );


        optionsContainer.innerHTML = `

            <button
                class="btn"
                onclick="chooseOption(1)"
            >

            </button>

            </button>

        `;

    /* =========================================================
       DIALOG
    ========================================================= */

    function chooseOption(optionNum) {

        const dialogText =
            document.getElementById(
                "dialog-text"
            );


        const optionsContainer =
            document.getElementById(
                "dialog-options"
            );


        if (
            optionNum === 1
        ) {

            dialogText.innerText =

            optionsContainer.innerHTML = `

                <button
                    class="btn"
                    onclick="askQuestion()"
                >
                    넌 어떤걸 좋아해?
                </button>

            `;

        }


        else if (
            optionNum === 2
        ) {

            dialogText.innerText =
                "말 좆같이 하네 고아새끼";


            optionsContainer.innerHTML = `

                <button
                    class="btn"
                    onclick="sayBadWord()"
                >

                </button>

            `;

        }

    }



    /* =========================================================
       BAD END
    ========================================================= */

    function sayBadWord() {

        alert(

        );


        location.reload();

    }



    /* =========================================================
       QUESTION
    ========================================================= */

    function askQuestion() {

        const dialogText =
            document.getElementById(
                "dialog-text"
            );


        const optionsContainer =
            document.getElementById(
                "dialog-options"
            );


        const randomAnswers = [

            "sex",

            "야동",

            "니엄마",

            "꺼져"

        ];


        const randomChoice =
            randomAnswers[
                Math.floor(
                    Math.random() *
                    randomAnswers.length
                )
            ];


        dialogText.innerText =
            `${randomChoice}\n\n이제 게임을 시작해!!`;


        optionsContainer.innerHTML = `

            <button
                class="btn"
                onclick="startQuiz()"
            >
                🎮 게임 시작 (START)
            </button>

        `;

    }



    /* =========================================================
       QUIZ DATA
       기존 설정 그대로

    /* =========================================================
       START QUIZ
    ========================================================= */

    function startQuiz() {

        currentQuizStage = 1;


        loadQuiz(
            currentQuizStage
        );


        showScreen(
            "screen-quiz"
        );

    }



    /* =========================================================
       LOAD QUIZ
    ========================================================= */

    function loadQuiz(stage) {

        const quiz =
            quizzes[stage];


        /* -------------------------
           진행률
        ------------------------- */

        const progressText =
            document.getElementById(
                "progress-text"
            );


        const progressFill =
            document.getElementById(
                "progress-fill"
            );


        progressText.innerText =
            `STAGE ${stage} / 4`;


        progressFill.style.width =
            `${(stage / 4) * 100}%`;



        /* -------------------------
           제목
        ------------------------- */

        document
            .getElementById(
                "quiz-title"
            )
            .innerText =
            quiz.title;



        /* -------------------------
           이미지
        ------------------------- */

        document
            .getElementById(
                "quiz-img"
            )
            .src =
            quiz.image;



        /* -------------------------
           질문
        ------------------------- */

        document
            .getElementById(
                "quiz-question"
            )
            .innerText =
            quiz.question;



        /* -------------------------
           입력창 초기화
        ------------------------- */

        const input =
            document.getElementById(
                "quiz-answer-input"
            );


        input.value = "";


        input.disabled = false;



        /* -------------------------
           피드백
        ------------------------- */

        const feedback =
            document.getElementById(
                "quiz-feedback"
            );


        const nextBtn =
            document.getElementById(
                "next-stage-btn"
            );


        feedback.style.display =
            "none";


        nextBtn.style.display =
            "none";



        /* -------------------------
           이미지 애니메이션
        ------------------------- */

        const img =
            document.getElementById(
                "quiz-img"
            );


        img.style.animation =
            "none";


        void img.offsetWidth;


        img.style.animation =
            "characterAppear .65s cubic-bezier(.22,1,.36,1)";



        /* -------------------------
           질문 애니메이션
        ------------------------- */

        const question =
            document.getElementById(
                "quiz-question"
            );


        question.style.animation =
            "none";


        void question.offsetWidth;


        question.style.animation =
            "bubbleAppear .5s cubic-bezier(.22,1,.36,1)";



        /* -------------------------
           자동 포커스
        ------------------------- */

        setTimeout(() => {

            input.focus();

        }, 350);

    }



    /* =========================================================
       SUBMIT ANSWER
    ========================================================= */

    function submitAnswer() {

        const inputAnswer =
            document
                .getElementById(
                    "quiz-answer-input"
                )
                .value
                .trim();


        const quiz =
            quizzes[
                currentQuizStage
            ];


        const feedback =
            document.getElementById(
                "quiz-feedback"
            );


        const nextBtn =
            document.getElementById(
                "next-stage-btn"
            );


        const input =
            document.getElementById(
                "quiz-answer-input"
            );



        /* -------------------------
           빈칸
        ------------------------- */

        if (
            inputAnswer === ""
        ) {

            alert(
                "정답을 입력하세요!"
            );


            input.classList.add(
                "shake"
            );


            setTimeout(() => {

                input.classList.remove(
                    "shake"
                );

            }, 450);


            input.focus();


            return;

        }



        /* -------------------------
           피드백 표시
        ------------------------- */

        feedback.style.display =
            "block";


        feedback.style.animation =
            "none";


        void feedback.offsetWidth;


        feedback.style.animation =
            "feedbackAppear .4s cubic-bezier(.22,1,.36,1)";



        /* =====================================================
           정답
        ===================================================== */

        if (
            quiz.answers.includes(
                inputAnswer
            )
        ) {

            feedback.innerText =
                quiz.correctMsg;


            if (
                currentQuizStage < 4
            ) {

                nextBtn.innerText =
                    "다음 문제로 →";

            }

            else {

                nextBtn.innerText =
                    "게임 완료 (처음으로)";

            }


            nextBtn.style.display =
                "block";


            input.disabled = true;

        }



        /* =====================================================
           오답
        ===================================================== */

        else {

            feedback.innerText =
                quiz.wrongMsg;


            nextBtn.style.display =
                "none";


            input.disabled = false;


            input.value = "";


            input.classList.remove(
                "shake"
            );


            void input.offsetWidth;


            input.classList.add(
                "shake"
            );


            setTimeout(() => {

                input.classList.remove(
                    "shake"
                );

            }, 450);


            setTimeout(() => {

                input.focus();

            }, 100);

        }

    }



    /* =========================================================
       NEXT QUIZ
    ========================================================= */

    function nextQuizStage() {

        const input =
            document.getElementById(
                "quiz-answer-input"
            );


        /*
            정답을 맞힌 상태가 아니면
            다음 문제로 넘어가지 않음
        */

        if (
            !input.disabled
        ) {

            return;

        }


        if (
            currentQuizStage < 4
        ) {

            currentQuizStage++;


            loadQuiz(
                currentQuizStage
            );

        }

        else {

            alert(
                "게임 클리어!! 승우와 결혼 축하합니다!! 승우: 우리 결혼은 당장 중국으로 떠날 것"
            );


            location.reload();

        }

    }



    /* =========================================================
       ENTER KEY
    ========================================================= */

    document.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key !== "Enter"
            ) {

                return;

            }


            const nameScreen =
                document.getElementById(
                    "screen-name"
                );


            const quizScreen =
                document.getElementById(
                    "screen-quiz"
                );



            /* 이름 입력 */

            if (
                nameScreen.classList.contains(
                    "active"
                )
            ) {

                saveName();

            }



            /* 퀴즈 */

            else if (
                quizScreen.classList.contains(
                    "active"
                )
            ) {

                const input =
                    document.getElementById(
                        "quiz-answer-input"
                    );


                /*
                    정답을 맞힌 뒤에는
                    Enter로 다음 문제로 넘어가지 않음
                */

                if (
                    !input.disabled
                ) {

                    submitAnswer();

                }

            }

        }
    );



    /* =========================================================
       BUTTON RIPPLE
    ========================================================= */

    document.addEventListener(
        "click",
        function(event) {

            const button =
                event.target.closest(
                    ".btn"
                );


            if (!button) {

                return;

            }


            const ripple =
                document.createElement(
                    "span"
                );


            ripple.className =
                "ripple";


            const rect =
                button.getBoundingClientRect();


            const size =
                Math.max(
                    rect.width,
                    rect.height
                );


            ripple.style.width =
                size + "px";


            ripple.style.height =
                size + "px";


            ripple.style.left =
                (
                    event.clientX -
                    rect.left -
                    size / 2
                ) + "px";


            ripple.style.top =
                (
                    event.clientY -
                    rect.top -
                    size / 2
                ) + "px";


            button.appendChild(
                ripple
            );


            setTimeout(() => {

                ripple.remove();

            }, 600);

        }
    );


</script>
