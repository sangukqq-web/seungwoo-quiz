<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>승우와의 대화 게임</title>

    <style>
        /* =========================================================
           GLOBAL
        ========================================================= */

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            font-family:
                "Pretendard",
                "Noto Sans KR",
                "Apple SD Gothic Neo",
                Arial,
                sans-serif;

            background:
                radial-gradient(circle at 20% 20%, rgba(120, 119, 255, .22), transparent 30%),
                radial-gradient(circle at 80% 80%, rgba(0, 210, 255, .18), transparent 30%),
                linear-gradient(135deg, #090b17, #10152c 50%, #080b15);

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100dvh;
            overflow: hidden;

            color: #151827;
        }

        /* 배경 움직임 */

        body::before,
        body::after {
            content: "";
            position: fixed;
            width: 380px;
            height: 380px;
            border-radius: 50%;
            filter: blur(80px);
            opacity: .28;
            pointer-events: none;
            animation: floatingOrb 9s ease-in-out infinite alternate;
        }

        body::before {
            background: #5865ff;
            top: -180px;
            left: -150px;
        }

        body::after {
            background: #00d4ff;
            right: -170px;
            bottom: -180px;
            animation-delay: -4s;
        }

        @keyframes floatingOrb {
            from {
                transform: translate3d(0, 0, 0) scale(1);
            }

            to {
                transform: translate3d(50px, 35px, 0) scale(1.15);
            }
        }


        /* =========================================================
           GAME CONTAINER
        ========================================================= */

        #game-container {
            width: min(400px, calc(100vw - 24px));
            height: min(600px, calc(100dvh - 24px));

            min-height: 500px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.94),
                    rgba(247,249,255,.91)
                );

            border: 1px solid rgba(255,255,255,.8);

            border-radius: 28px;

            box-shadow:
                0 35px 90px rgba(0,0,0,.35),
                0 10px 35px rgba(0,0,0,.18),
                inset 0 1px 0 rgba(255,255,255,.9);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            display: flex;
            flex-direction: column;
            align-items: center;

            padding: 22px;

            position: relative;
            overflow: hidden;

            isolation: isolate;
        }

        /* 위쪽 빛 */

        #game-container::before {
            content: "";
            position: absolute;

            width: 220px;
            height: 220px;

            top: -150px;
            left: 50%;
            transform: translateX(-50%);

            background: rgba(100, 110, 255, .22);

            filter: blur(35px);

            pointer-events: none;
        }


        /* =========================================================
           SCREEN
        ========================================================= */

        .screen {
            display: none;

            flex-direction: column;
            align-items: center;

            width: 100%;
            height: 100%;

            justify-content: space-between;

            position: relative;
            z-index: 2;

            opacity: 0;
        }

        .screen.active {
            display: flex;

            animation: screenEnter .55s cubic-bezier(.22,1,.36,1) forwards;
        }

        .screen.screen-exit {
            animation: screenExit .28s ease forwards;
        }

        @keyframes screenEnter {
            0% {
                opacity: 0;
                transform: translateY(24px) scale(.97);
                filter: blur(5px);
            }

            60% {
                opacity: 1;
                filter: blur(0);
            }

            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes screenExit {
            from {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

            to {
                opacity: 0;
                transform: translateY(-15px) scale(.985);
            }
        }


        /* =========================================================
           TITLE
        ========================================================= */

        h2 {
            margin: 8px 0 0;

            font-size: 30px;
            font-weight: 900;

            letter-spacing: -1.5px;

            background:
                linear-gradient(
                    135deg,
                    #303cff,
                    #8a3ffc,
                    #00a8ff
                );

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;

            animation: titleFloat 3s ease-in-out infinite;
        }

        h3 {
            margin: 8px 0;

            font-size: 21px;
            font-weight: 850;

            letter-spacing: -0.7px;
        }

        @keyframes titleFloat {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-4px);
            }
        }


        /* =========================================================
           CHARACTER IMAGE
        ========================================================= */

        img.character-img {
            width: auto;
            max-width: 250px;
            max-height: 250px;

            object-fit: contain;

            border-radius: 18px;

            margin-bottom: 15px;

            filter:
                drop-shadow(0 15px 20px rgba(0,0,0,.16));

            transition:
                transform .35s cubic-bezier(.22,1,.36,1),
                filter .35s ease;

            animation: characterAppear .65s cubic-bezier(.22,1,.36,1);
        }

        img.character-img:hover {
            transform: translateY(-7px) scale(1.025);

            filter:
                drop-shadow(0 20px 28px rgba(55,70,200,.22));
        }

        @keyframes characterAppear {
            0% {
                opacity: 0;
                transform: translateY(25px) scale(.9);
            }

            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }


        /* =========================================================
           SPEECH BUBBLE
        ========================================================= */

        .speech-bubble {
            background:
                linear-gradient(
                    135deg,
                    rgba(230,247,255,.98),
                    rgba(239,244,255,.98)
                );

            border: 1px solid rgba(90,120,255,.10);

            border-radius: 18px;

            padding: 15px 17px;

            position: relative;

            width: 90%;

            text-align: center;

            font-size: 16px;
            font-weight: 750;

            line-height: 1.55;

            box-shadow:
                0 8px 20px rgba(40,70,150,.08),
                inset 0 1px 0 rgba(255,255,255,.9);

            margin-bottom: 10px;

            word-break: keep-all;

            animation: bubbleAppear .5s cubic-bezier(.22,1,.36,1);
        }

        .speech-bubble::after {
            content: "";

            position: absolute;

            bottom: -8px;
            left: 50%;

            width: 16px;
            height: 16px;

            background: #eaf6ff;

            transform:
                translateX(-50%)
                rotate(45deg);

            border-right: 1px solid rgba(90,120,255,.08);
            border-bottom: 1px solid rgba(90,120,255,.08);
        }

        @keyframes bubbleAppear {
            from {
                opacity: 0;
                transform: translateY(10px) scale(.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }


        /* =========================================================
           INPUT
        ========================================================= */

        .input-box {
            width: 82%;

            padding: 13px 15px;

            margin: 10px 0;

            font-size: 16px;
            font-weight: 650;

            border:
                1px solid rgba(120,130,160,.28);

            border-radius: 13px;

            outline: none;

            text-align: center;

            background: rgba(255,255,255,.85);

            box-shadow:
                0 5px 15px rgba(0,0,0,.05);

            transition:
                border-color .2s ease,
                box-shadow .2s ease,
                transform .2s ease,
                background .2s ease;
        }

        .input-box::placeholder {
            color: #9aa0b3;
        }

        .input-box:focus {
            border-color: #6674ff;

            background: #fff;

            box-shadow:
                0 0 0 4px rgba(102,116,255,.13),
                0 8px 20px rgba(70,80,180,.08);

            transform: translateY(-1px);
        }


        /* =========================================================
           BUTTON
        ========================================================= */

        .btn {
            position: relative;
            overflow: hidden;

            background:
                linear-gradient(
                    135deg,
                    #5261ff,
                    #714cff
                );

            color: white;

            padding: 12px 20px;

            border: none;

            border-radius: 13px;

            cursor: pointer;

            font-size: 15px;
            font-weight: 800;

            letter-spacing: -.2px;

            margin: 5px;

            width: 90%;

            min-height: 46px;

            box-shadow:
                0 7px 18px rgba(82,97,255,.25),
                inset 0 1px 0 rgba(255,255,255,.25);

            transition:
                transform .15s ease,
                box-shadow .15s ease,
                filter .15s ease;
        }

        .btn::before {
            content: "";

            position: absolute;

            top: 0;
            left: -100%;

            width: 60%;
            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,.35),
                    transparent
                );

            transform: skewX(-20deg);

            transition: left .55s ease;
        }

        .btn:hover::before {
            left: 130%;
        }

        .btn:hover {
            transform: translateY(-3px);

            box-shadow:
                0 12px 25px rgba(82,97,255,.32),
                inset 0 1px 0 rgba(255,255,255,.3);

            filter: brightness(1.04);
        }

        .btn:active {
            transform: translateY(1px) scale(.98);

            box-shadow:
                0 4px 10px rgba(82,97,255,.2);
        }


        /* =========================================================
           OPTIONS
        ========================================================= */

        .options-container {
            width: 100%;

            display: flex;
            flex-direction: column;

            align-items: center;

            margin-top: 5px;
        }

        .options-container .btn {
            animation:
                optionAppear .45s cubic-bezier(.22,1,.36,1) both;
        }

        .options-container .btn:nth-child(1) {
            animation-delay: .05s;
        }

        .options-container .btn:nth-child(2) {
            animation-delay: .12s;
        }

        .options-container .btn:nth-child(3) {
            animation-delay: .19s;
        }

        .options-container .btn:nth-child(4) {
            animation-delay: .26s;
        }

        @keyframes optionAppear {
            from {
                opacity: 0;
                transform: translateY(14px) scale(.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }


        /* =========================================================
           START SCREEN
        ========================================================= */

        #screen-start > div {
            transition:
                transform .35s cubic-bezier(.22,1,.36,1);
        }

        #screen-start > div:hover {
            transform: scale(1.025);
        }

        #screen-start img {
            cursor: pointer;

            animation:
                characterAppear .7s cubic-bezier(.22,1,.36,1),
                startImageFloat 3.2s ease-in-out .7s infinite;
        }

        @keyframes startImageFloat {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-9px);
            }
        }


        /* =========================================================
           QUIZ
        ========================================================= */

        #screen-quiz {
            justify-content: flex-start;
            gap: 5px;

            overflow-y: auto;
            overflow-x: hidden;

            padding-bottom: 5px;

            scrollbar-width: none;
        }

        #screen-quiz::-webkit-scrollbar {
            display: none;
        }

        #quiz-title {
            margin-bottom: 4px;

            font-size: 19px;

            background:
                linear-gradient(90deg,#4654ff,#963fff);

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;
        }

        #quiz-img {
            max-height: 205px;
            margin-bottom: 8px;
        }

        #quiz-question {
            margin-bottom: 8px;
        }

        #quiz-feedback {
            animation:
                feedbackAppear .4s cubic-bezier(.22,1,.36,1);
        }

        @keyframes feedbackAppear {
            0% {
                opacity: 0;
                transform: scale(.9) translateY(10px);
            }

            70% {
                transform: scale(1.02);
            }

            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }


        /* =========================================================
           WRONG / CORRECT SHAKE
        ========================================================= */

        .shake {
            animation: shake .42s ease;
        }

        @keyframes shake {
            0%, 100% {
                transform: translateX(0);
            }

            20% {
                transform: translateX(-8px);
            }

            40% {
                transform: translateX(8px);
            }

            60% {
                transform: translateX(-5px);
            }

            80% {
                transform: translateX(5px);
            }
        }


        /* =========================================================
           CLICK RIPPLE
        ========================================================= */

        .ripple {
            position: absolute;

            border-radius: 50%;

            transform: scale(0);

            background: rgba(255,255,255,.5);

            animation: ripple .55s linear;

            pointer-events: none;
        }

        @keyframes ripple {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }


        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 480px) {

            body {
                padding: 12px;
            }

            #game-container {
                width: 100%;
                height: calc(100dvh - 24px);

                min-height: 0;

                border-radius: 24px;

                padding:
                    18px
                    14px
                    14px;
            }

            h2 {
                font-size: 27px;
            }

            h3 {
                font-size: 19px;
            }

            img.character-img {
                max-width: min(220px, 68vw);
                max-height: 205px;
            }

            #quiz-img {
                max-height: 175px;
            }

            .speech-bubble {
                width: 94%;

                font-size: 15px;

                padding: 13px 14px;
            }

            .btn {
                width: 94%;

                min-height: 48px;

                font-size: 15px;

                padding: 12px 14px;
            }

            .input-box {
                width: 88%;

                font-size: 16px;
            }
        }


        /* 아주 작은 휴대폰 */

        @media (max-height: 650px) {

            #game-container {
                padding-top: 12px;
            }

            h2 {
                margin: 3px 0;
            }

            img.character-img {
                max-height: 160px;
            }

            #quiz-img {
                max-height: 135px;
            }

            .speech-bubble {
                padding: 10px 12px;
            }

            .btn {
                min-height: 42px;
                padding: 9px 14px;
            }
        }


        /* =========================================================
           TOUCH DEVICES
        ========================================================= */

        @media (hover: none) {

            .btn:hover {
                transform: none;
                filter: none;
                box-shadow:
                    0 7px 18px rgba(82,97,255,.25),
                    inset 0 1px 0 rgba(255,255,255,.25);
            }

            img.character-img:hover {
                transform: none;
            }

            .btn:active {
                transform: scale(.96);
            }
        }


        /* =========================================================
           REDUCED MOTION
        ========================================================= */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>


<body>

<div id="game-container">

    <!-- START 화면 -->
    <div id="screen-start" class="screen active">

        <h2>승우 게임</h2>

        <div
            style="position: relative; cursor: pointer;"
            onclick="goToNameInput()"
        >
            <div class="speech-bubble">
                나를 눌러봐!
            </div>

            <img
                src="photo1.png"
                alt="첫번째 사진"
                class="character-img"
            >
        </div>

    </div>


    <!-- 이름 입력 화면 -->
    <div id="screen-name" class="screen">

        <h3>이름을 입력하시오</h3>

        <input
            type="text"
            id="user-name-input"
            class="input-box"
            placeholder="이름 입력..."
            autocomplete="off"
        >

        <button
            class="btn"
            onclick="saveName()"
        >
            확인
        </button>

    </div>


    <!-- 대화 화면 -->
    <div id="screen-dialog" class="screen">

        <img
            src="photo1.png"
            alt="첫번째 사진"
            class="character-img"
        >

        <div
            id="dialog-text"
            class="speech-bubble"
        >
            하이, 내 이름은 이승우야. 만나서 반가워
        </div>

        <div
            id="dialog-options"
            class="options-container"
        >
            <!-- 선택지 버튼이 여기에 동적으로 추가됨 -->
        </div>

    </div>


    <!-- 퀴즈 화면 -->
    <div id="screen-quiz" class="screen">

        <h3 id="quiz-title">
            문제
        </h3>

        <img
            id="quiz-img"
            src=""
            alt="퀴즈 이미지"
            class="character-img"
        >

        <div
            id="quiz-question"
            class="speech-bubble"
        >
            질문
        </div>

        <input
            type="text"
            id="quiz-answer-input"
            class="input-box"
            placeholder="정답 입력..."
            autocomplete="off"
        >

        <button
            class="btn"
            onclick="submitAnswer()"
        >
            정답 제출
        </button>

        <div
            id="quiz-feedback"
            class="speech-bubble"
            style="display:none; margin-top:10px;"
        ></div>

        <button
            id="next-stage-btn"
            class="btn"
            style="display:none;"
            onclick="nextQuizStage()"
        >
            다음으로
        </button>

    </div>

</div>


<script>

    let userName = "";
    let currentQuizStage = 1;


    /* =========================================================
       IMAGE
    ========================================================= */

    const images = {
        photo1: "photo1.png",
        photo2: "photo2.png",
        photo3: "photo3.png",
        photo4: "photo4.png"
    };


    /* =========================================================
       SCREEN TRANSITION
       기존 화면 전환 기능을 유지하면서 애니메이션만 추가
    ========================================================= */

    function showScreen(screenId) {

        const currentScreen =
            document.querySelector(".screen.active");

        const nextScreen =
            document.getElementById(screenId);

        if (currentScreen === nextScreen) return;


        if (currentScreen) {

            currentScreen.classList.add("screen-exit");

            setTimeout(() => {

                currentScreen.classList.remove("active");
                currentScreen.classList.remove("screen-exit");

                nextScreen.classList.add("active");

            }, 260);

        } else {

            nextScreen.classList.add("active");

        }
    }


    /* =========================================================
       START
    ========================================================= */

    function goToNameInput() {

        showScreen("screen-name");

        setTimeout(() => {

            document
                .getElementById("user-name-input")
                .focus();

        }, 350);
    }


    /* =========================================================
       SAVE NAME
    ========================================================= */

    function saveName() {

        const input =
            document
                .getElementById("user-name-input")
                .value
                .trim();

        if (input === "") {

            alert("이름을 입력해 주세요!");

            const inputBox =
                document.getElementById("user-name-input");

            inputBox.classList.add("shake");

            setTimeout(() => {
                inputBox.classList.remove("shake");
            }, 450);

            return;
        }

        userName = input;

        setupInitialDialog();

        showScreen("screen-dialog");
    }


    /* =========================================================
       INITIAL DIALOG
    ========================================================= */

    function setupInitialDialog() {

        const optionsContainer =
            document.getElementById("dialog-options");

        optionsContainer.innerHTML = `

            <button
                class="btn"
                onclick="chooseOption(1)"
            >
                1. 반가워 내 이름은 ${userName}이야.
            </button>

            <button
                class="btn"
                onclick="chooseOption(2)"
            >
                2. 꺼져 시발련아.
            </button>

        `;
    }


    /* =========================================================
       DIALOG
    ========================================================= */

    function chooseOption(optionNum) {

        const dialogText =
            document.getElementById("dialog-text");

        const optionsContainer =
            document.getElementById("dialog-options");


        if (optionNum === 1) {

            dialogText.innerText =
                `오 너 이름은 ${userName}이구나`;

            optionsContainer.innerHTML = `

                <button
                    class="btn"
                    onclick="askQuestion()"
                >
                    넌 어떤걸 좋아해?
                </button>

            `;

        }

        else if (optionNum === 2) {

            dialogText.innerText =
                "말 좆같이 하네 고아새끼";

            optionsContainer.innerHTML = `

                <button
                    class="btn"
                    onclick="sayBadWord()"
                >
                    ㅗ
                </button>

            `;
        }
    }


    /* =========================================================
       BAD END
    ========================================================= */

    function sayBadWord() {

        alert("대화가 종료되었습니다.");

        location.reload();
    }


    /* =========================================================
       QUESTION
    ========================================================= */

    function askQuestion() {

        const dialogText =
            document.getElementById("dialog-text");

        const optionsContainer =
            document.getElementById("dialog-options");


        const randomAnswers = [
            "sex",
            "야동",
            "니엄마",
            "꺼져"
        ];


        const randomChoice =
            randomAnswers[
                Math.floor(
                    Math.random() * randomAnswers.length
                )
            ];


        dialogText.innerText =
            `${randomChoice}\n\n이제 게임을 시작해!!`;


        optionsContainer.innerHTML = `

            <button
                class="btn"
                onclick="startQuiz()"
            >
                🎮 게임 시작 (START)
            </button>

        `;
    }


    /* =========================================================
       QUIZ DATA
       ★ 여기 내용은 기존 코드 그대로
    ========================================================= */

    const quizzes = {

        1: {
            title: "스테이지 1 - 문제 1",
            image: images.photo2,
            question: "내가 좋아하는 행위는?",
            answers: [
                "sex",
                "섹스",
                "야한 얘기하기",
                "야동 시청"
            ],
            wrongMsg:
                "에휴 친구란 놈이 그것도 못 맞추냐. 한심하노",
            correctMsg:
                "넌 역시 내 친구구나 아마 우린 취향이 같나봐! 다음문제로 넘어가!"
        },

        2: {
            title: "스테이지 2 - 문제 2",
            image: images.photo3,
            question: "내가 좋아하는 아이돌은?",
            answers: [
                "스텔라이브",
                "스텔",
                "아라하시 타비",
                "타비"
            ],
            wrongMsg:

    /* =========================================================
       START QUIZ
    ========================================================= */

    function startQuiz() {

        currentQuizStage = 1;

        loadQuiz(currentQuizStage);

        showScreen("screen-quiz");
    }


    /* =========================================================
       LOAD QUIZ
    ========================================================= */

    function loadQuiz(stage) {

        const quiz = quizzes[stage];


        document
            .getElementById("quiz-title")
            .innerText = quiz.title;


        document
            .getElementById("quiz-img")
            .src = quiz.image;


        document
            .getElementById("quiz-question")
            .innerText = quiz.question;


        document
            .getElementById("quiz-answer-input")
            .value = "";


        const feedback =
            document.getElementById("quiz-feedback");

        const nextBtn =
            document.getElementById("next-stage-btn");


        feedback.style.display = "none";

        nextBtn.style.display = "none";


        /* 이미지 새로 등장하는 효과 */

        const img =
            document.getElementById("quiz-img");

        img.style.animation = "none";

        void img.offsetWidth;

        img.style.animation =
            "characterAppear .65s cubic-bezier(.22,1,.36,1)";


        /* 질문도 새로 등장 */

        const question =
            document.getElementById("quiz-question");

        question.style.animation = "none";

        void question.offsetWidth;

        question.style.animation =
            "bubbleAppear .5s cubic-bezier(.22,1,.36,1)";


        setTimeout(() => {

            document
                .getElementById("quiz-answer-input")
                .focus();

        }, 350);
    }


    /* =========================================================
       SUBMIT ANSWER
    ========================================================= */

    function submitAnswer() {

        const inputAnswer =
            document
                .getElementById("quiz-answer-input")
                .value
                .trim();


        const quiz =
            quizzes[currentQuizStage];


        const feedback =
            document.getElementById("quiz-feedback");


        const nextBtn =
            document.getElementById("next-stage-btn");


        if (inputAnswer === "") {

            alert("정답을 입력하세요!");

            const input =
                document.getElementById(
                    "quiz-answer-input"
                );

            input.classList.add("shake");

            setTimeout(() => {
                input.classList.remove("shake");
            }, 450);

            return;
        }


        feedback.style.display = "block";


        /* 애니메이션 재시작 */

        feedback.style.animation = "none";

        void feedback.offsetWidth;

        feedback.style.animation =
            "feedbackAppear .4s cubic-bezier(.22,1,.36,1)";


        if (quiz.answers.includes(inputAnswer)) {

            feedback.innerText =
                quiz.correctMsg;


            if (currentQuizStage < 4) {

                nextBtn.innerText =
                    "다음 문제로 →";

                nextBtn.style.display =
                    "block";

            }

            else {

                nextBtn.innerText =
                    "게임 완료 (처음으로)";

                nextBtn.style.display =
                    "block";
            }

        }

        else {

            feedback.innerText =
                quiz.wrongMsg;


            nextBtn.innerText =
                "다시 시도 / 다음으로";

            nextBtn.style.display =
                "block";
        }
    }


    /* =========================================================
       NEXT QUIZ
    ========================================================= */

    function nextQuizStage() {

        if (currentQuizStage < 4) {

            currentQuizStage++;

            loadQuiz(currentQuizStage);

        }

        else {

            alert(
                "게임 클리어!! 승우와 결혼 축하합니다!!"
            );

            location.reload();
        }
    }


    /* =========================================================
       ENTER KEY SUPPORT
       모바일/PC 둘 다 편하게 사용
    ========================================================= */

    document.addEventListener("keydown", function(event) {

        if (event.key !== "Enter") return;


        const nameScreen =
            document.getElementById("screen-name");

        const quizScreen =
            document.getElementById("screen-quiz");


        if (nameScreen.classList.contains("active")) {

            saveName();

        }

        else if (quizScreen.classList.contains("active")) {

            submitAnswer();

        }

    });


    /* =========================================================
       BUTTON RIPPLE EFFECT
    ========================================================= */

    document.addEventListener("click", function(event) {

        const button =
            event.target.closest(".btn");


        if (!button) return;


        const ripple =
            document.createElement("span");


        ripple.className = "ripple";


        const rect =
            button.getBoundingClientRect();


        const size =
            Math.max(
                rect.width,
                rect.height
            );


        ripple.style.width = size + "px";
        ripple.style.height = size + "px";


        ripple.style.left =
            (event.clientX - rect.left - size / 2)
            + "px";


        ripple.style.top =
            (event.clientY - rect.top - size / 2)
            + "px";


        button.appendChild(ripple);


        setTimeout(() => {

            ripple.remove();

        }, 600);

    });


</script>
